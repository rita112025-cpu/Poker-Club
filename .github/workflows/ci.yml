name: Foundation checks
on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: poker_club_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poker -d poker_club_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://poker:ci-only-password@localhost:5432/poker_club_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements-dev.lock
      - run: .venv/bin/python -m pip install --no-deps -e ./backend
      - run: .venv/bin/python -m pytest backend/tests -q
      - run: .venv/bin/python -m ruff check backend
      - run: .venv/bin/python -m ruff format --check backend
      - run: .venv/bin/python -m mypy backend/app backend/tests
      - run: .venv/bin/python -m pip check
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-password

  docker-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements-dev.lock
      - run: .venv/bin/python -m pip install --no-deps -e ./backend
      - run: .venv/bin/python scripts/verify_phase1_docker.py
